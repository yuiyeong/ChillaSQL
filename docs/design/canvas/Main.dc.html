<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ChillaSQL workspace</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0C0F}
a{color:#7C9CFF}a:hover{color:#A5BBFF}
button,input,textarea{font:inherit;color:inherit}
.cs{font-family:-apple-system,BlinkMacSystemFont,Inter,'Apple SD Gothic Neo',sans-serif;font-size:15px;line-height:1.4;color:#E8E9ED}
@font-face{font-family:'D2Coding';src:url(/_blob/9dcd768ab87d0e66ac1867bef2148601) format('truetype');font-weight:400;font-style:normal}
@font-face{font-family:'D2Coding';src:url(/_blob/7f3d51479cd4b88575a6bc2c42556a16) format('truetype');font-weight:600 700;font-style:normal}
.mono{font-family:'D2Coding',ui-monospace,Menlo,monospace;font-variant-ligatures:none}
.btn svg,.btn .kbd{flex-shrink:0}
.code{font-family:'D2Coding',ui-monospace,Menlo,monospace;font-variant-ligatures:none;font-size:.92em;padding:1px 5px;border-radius:4px;background:#262830;border:1px solid #33363E;white-space:nowrap}
.code.kw{color:#C792EA}
.label{margin:0;font-size:12px;font-weight:600;letter-spacing:.04em;color:#A3A6B0}
.kbd{font-family:inherit;font-size:12px;font-weight:500;padding:1px 5px;border-radius:4px;background:#262830;color:#A3A6B0}
.btn{display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 12px;border:1px solid #33363E;border-radius:7px;background:#1C1D23;color:#E8E9ED;font-size:15px;cursor:pointer;white-space:nowrap}
.btn-primary{background:#7C9CFF;border-color:#7C9CFF;color:#0F1014;font-weight:600}
.btn-primary .kbd{background:rgba(15,16,20,.18);color:#0F1014}
.btn-ghost{background:transparent;border-color:transparent;color:#A3A6B0}
.ibtn{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:6px;background:transparent;color:#A3A6B0;cursor:pointer;flex-shrink:0}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.tx{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 6px;border:1px solid #33363E;border-radius:4px;font-size:12px;font-weight:500;color:#E8E9ED;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 10px;border:1px solid #33363E;border-radius:7px;background:#1C1D23;cursor:pointer;white-space:nowrap}
.seg{display:inline-flex;padding:2px;gap:2px;background:#1C1D23;border:1px solid #33363E;border-radius:7px}
.seg button{height:22px;padding:0 10px;border:0;border-radius:5px;background:transparent;color:#A3A6B0;font-size:13px;font-weight:500;cursor:pointer}
.seg button[aria-checked="true"]{background:#262830;color:#E8E9ED}
</style>
</helmet>
<div class="cs" style="width: 1512px; height: 982px; display: flex; flex-direction: column; background: #0F1014; border: 1px solid #23252B; border-radius: 10px; box-sizing: border-box; overflow: hidden">
  <!-- 창 상단 접속 bar: 창 전체 폭, 모든 접속이 같은 두께 -->
  <div aria-hidden="true" style="height: 3px; flex-shrink: 0; background: {{connColor}}"></div>

  <div style="flex: 1; min-height: 0; display: flex">
    <!-- Sidebar -->
    <aside aria-label="Project" style="width: 248px; flex-shrink: 0; display: flex; flex-direction: column; border-right: 1px solid #23252B">
      <div style="height: 38px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 14px">
        <span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; background: #FF5F57"></span>
        <span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; background: #FEBC2E"></span>
        <span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; background: #28C840"></span>
      </div>

      <div style="padding: 2px 10px 12px">
        <button type="button" aria-label="Switch project" style="width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: #15161B; border: 1px solid #23252B; border-radius: 8px; cursor: pointer; text-align: left">
          <span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 6px; background: #262830; color: #E8E9ED; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 12px">CD</span>
          <span style="display: flex; flex-direction: column; min-width: 0; flex: 1">
            <span style="font-weight: 600">chilla-demo</span>
            <span style="font-size: 12px; color: #A3A6B0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">~/work/chilla-demo</span>
          </span>
          <svg aria-hidden="true" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#A3A6B0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6l3-3 3 3M5 10l3 3 3-3"></path></svg>
        </button>
      </div>

      <!-- 접속: sidebar 탭 위. 관리 전용(누르면 수정 form). 탭의 접속은 toolbar chip에서만 바꾼다 -->
      <section aria-label="Connections" style="display: flex; flex-direction: column; gap: 1px; padding: 0 6px 12px; border-bottom: 1px solid #23252B">
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 8px 4px">
          <h3 class="label">Connections</h3>
          <button type="button" class="ibtn" aria-label="Add connection" style="width: 22px; height: 22px">
            <svg aria-hidden="true" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 3v10M3 8h10"></path></svg>
          </button>
        </div>
        <sc-for list="{{connections}}" as="c" hint-placeholder-count="3">
          <button type="button" aria-label="{{c.editLabel}}" style="display: flex; align-items: center; gap: 10px; width: 100%; padding: 5px 8px; border: 0; border-radius: 6px; background: transparent; cursor: pointer; text-align: left">
            <span aria-hidden="true" class="dot" style="{{c.dotStyle}}"></span>
            <span style="display: flex; flex-direction: column; min-width: 0; flex: 1">
              <span style="display: flex; align-items: center; gap: 6px; font-weight: 500">{{c.name}}
                <sc-if value="{{c.tunnel}}" hint-placeholder-val="{{false}}">
                  <svg role="img" aria-label="Tunnel" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="#A3A6B0" stroke-width="1.5" stroke-linecap="round"><path d="M2 13V8a6 6 0 0 1 12 0v5M5.5 13V8.5a2.5 2.5 0 0 1 5 0V13"></path></svg>
                </sc-if>
                <sc-if value="{{c.readonly}}" hint-placeholder-val="{{false}}">
                  <svg role="img" aria-label="Read-only" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="#A3A6B0" stroke-width="1.5" stroke-linecap="round"><rect x="3.5" y="7" width="9" height="6.5" rx="1.5"></rect><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"></path></svg>
                </sc-if>
              </span>
              <span class="mono" style="font-size: 12px; color: #8A8E99; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.sub}}</span>
            </span>
          </button>
        </sc-for>
      </section>

      <div role="tablist" aria-label="Sidebar view" class="seg" style="margin: 12px 10px 8px; display: flex">
        <button type="button" role="tab" aria-selected="true" aria-checked="true" style="flex: 1">Files</button>
        <button type="button" role="tab" aria-selected="false" style="flex: 1">Schema</button>
        <button type="button" role="tab" aria-selected="false" style="flex: 1">History</button>
      </div>

      <section aria-label="SQL Files" style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 1px; padding: 4px 6px">
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 8px 4px">
          <h3 class="label">SQL Files</h3>
          <button type="button" class="ibtn" aria-label="Refresh file list" style="width: 22px; height: 22px">
            <svg aria-hidden="true" width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8a5 5 0 1 1-1.5-3.5M13 2.5V5h-2.5"></path></svg>
          </button>
        </div>
        <sc-for list="{{files}}" as="f" hint-placeholder-count="5">
          <button type="button" style="{{f.rowStyle}}">
            <sc-if value="{{f.folder}}" hint-placeholder-val="{{false}}">
              <svg aria-hidden="true" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="#A3A6B0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="{{f.chevron}}"></path></svg>
              <svg aria-hidden="true" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#A3A6B0" stroke-width="1.4" stroke-linejoin="round"><path d="M2 4.5A1.5 1.5 0 0 1 3.5 3h3l1.5 1.5h4.5A1.5 1.5 0 0 1 14 6v5.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 11.5z"></path></svg>
            </sc-if>
            <sc-if value="{{f.file}}" hint-placeholder-val="{{true}}">
              <svg aria-hidden="true" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#8A8E99" stroke-width="1.4" stroke-linejoin="round"><path d="M4 2h5l3 3v9H4z"></path><path d="M9 2v3h3"></path></svg>
            </sc-if>
            <span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{f.name}}</span>
            <sc-if value="{{f.dirty}}" hint-placeholder-val="{{false}}">
              <span role="img" aria-label="Unsaved" style="width: 6px; height: 6px; border-radius: 50%; background: #E8E9ED"></span>
            </sc-if>
          </button>
        </sc-for>
      </section>
    </aside>

    <!-- Main column -->
    <main style="flex: 1; min-width: 0; display: flex; flex-direction: column; background: #15161B">
      <!-- 탭 줄 = title bar. 오른쪽 빈 칸은 창을 끄는 자리 -->
      <div style="height: 38px; flex-shrink: 0; display: flex; align-items: flex-end; background: #0F1014; border-bottom: 1px solid #23252B">
        <div role="tablist" aria-label="Open files" style="display: flex; align-items: flex-end; gap: 2px; padding: 0 8px">
          <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
            <div style="{{t.wrapStyle}}">
              <button type="button" role="tab" aria-selected="{{t.selected}}" style="display: flex; align-items: center; gap: 8px; border: 0; background: transparent; padding: 0; cursor: pointer; font-size: 13px; color: inherit">
                <span aria-hidden="true" class="dot" style="{{t.dotStyle}}"></span>
                <span>{{t.title}}</span>
                <sc-if value="{{t.tx}}" hint-placeholder-val="{{false}}">
                  <span class="tx" title="Transaction open">
                    <svg aria-hidden="true" width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 2a6 6 0 1 1-6 6"></path><path d="M8 5v3l2 1.5"></path></svg>
                    TX <span class="mono">{{t.txTime}}</span>
                  </span>
                </sc-if>
              </button>
              <sc-if value="{{t.dirty}}" hint-placeholder-val="{{false}}">
                <span role="img" aria-label="Unsaved" style="width: 7px; height: 7px; border-radius: 50%; background: #E8E9ED; margin-left: 4px"></span>
              </sc-if>
              <sc-if value="{{t.closable}}" hint-placeholder-val="{{true}}">
                <button type="button" class="ibtn" aria-label="{{t.closeLabel}}" style="width: 18px; height: 18px; border-radius: 4px; margin-left: 2px">
                  <svg aria-hidden="true" width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"></path></svg>
                </button>
              </sc-if>
            </div>
          </sc-for>
          <button type="button" class="ibtn" aria-label="New tab (Shift+Cmd+L)" style="margin: 0 0 4px 4px">
            <svg aria-hidden="true" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 3v10M3 8h10"></path></svg>
          </button>
        </div>
        <div aria-hidden="true" style="flex: 1; align-self: stretch"></div>
      </div>

      <!-- Toolbar -->
      <div role="toolbar" aria-label="Query" style="height: 44px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 1px solid #23252B">
        <button type="button" class="chip" aria-label="Change this tab's connection">
          <span aria-hidden="true" class="dot" style="background: {{connColor}}"></span>
          <span style="font-weight: 500">local</span>
          <span class="mono" style="color: #A3A6B0; font-size: 13px">chilla_test</span>
          <svg aria-hidden="true" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="#A3A6B0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"></path></svg>
        </button>
        <div role="radiogroup" aria-label="Transaction mode" class="seg">
          <button type="button" role="radio" aria-checked="true">Auto</button>
          <button type="button" role="radio" aria-checked="false">Manual</button>
        </div>
        <div style="flex: 1"></div>
        <button type="button" class="ibtn" aria-label="Reformat (Opt+Cmd+L)">
          <svg aria-hidden="true" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2.5 4h11M2.5 8h7M2.5 12h9"></path></svg>
        </button>
        <button type="button" class="ibtn" aria-label="Explain plan (EXPLAIN ANALYZE)">
          <svg aria-hidden="true" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2.5" width="5" height="3.5" rx="1"></rect><rect x="9" y="10" width="5" height="3.5" rx="1"></rect><path d="M4.5 6v2.5a1.5 1.5 0 0 0 1.5 1.5h3"></path></svg>
        </button>
        <div aria-hidden="true" style="width: 1px; height: 18px; background: #33363E"></div>
        <!-- 실행: label이 범위를 말한다(문장 / 선택). 파일 전체는 오른쪽 menu -->
        <div style="display: flex">
          <button type="button" class="btn btn-primary" style="width: 200px; box-sizing: border-box; border-radius: 7px 0 0 7px; padding: 0 8px 0 12px; background: {{accent}}; border-color: {{accent}}">
            <svg aria-hidden="true" width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.8v10.4a.8.8 0 0 0 1.2.7l8.4-5.2a.8.8 0 0 0 0-1.4L5.2 2.1a.8.8 0 0 0-1.2.7z"></path></svg>
            <span style="flex: 1; text-align: left">Run statement</span>
            <span class="kbd">⌘↵</span>
          </button>
          <button type="button" class="btn btn-primary" aria-label="Choose what to run" style="width: 26px; box-sizing: border-box; justify-content: center; border-radius: 0 7px 7px 0; padding: 0; margin-left: 1px; background: {{accent}}; border-color: {{accent}}">
            <svg aria-hidden="true" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"></path></svg>
          </button>
        </div>
      </div>

      <!-- Editor: 실행될 문장 범위만 강조(배경 + 왼쪽 bar). gutter는 강조하지 않음 -->
      <div class="mono" style="flex: 1; min-height: 0; display: flex; overflow: hidden; font-size: 15px; line-height: 24px">
        <div aria-hidden="true" style="width: 56px; flex-shrink: 0; padding-top: 10px; color: #8A8E99; text-align: right">
          <sc-for list="{{lines}}" as="l" hint-placeholder-count="14">
            <div style="height: 24px; padding-right: 14px">{{l.gutter}}</div>
          </sc-for>
        </div>
        <div style="flex: 1; min-width: 0; padding-top: 10px">
          <sc-for list="{{lines}}" as="l" hint-placeholder-count="14">
            <div style="{{l.lineStyle}}"><sc-for list="{{l.toks}}" as="tk" hint-placeholder-count="3"><span style="{{tk.s}}">{{tk.t}}</span></sc-for><sc-if value="{{l.cursor}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="display: inline-block; width: 2px; height: 19px; vertical-align: -4px; background: #E8E9ED"></span></sc-if></div>
          </sc-for>
        </div>
      </div>

      <div aria-hidden="true" style="height: 5px; flex-shrink: 0; border-top: 1px solid #23252B; background: #0F1014; display: flex; justify-content: center; align-items: center">
        <span style="width: 36px; height: 3px; border-radius: 2px; background: #33363E"></span>
      </div>

      <!-- Results -->
      <section aria-label="Results" style="height: 396px; flex-shrink: 0; display: flex; flex-direction: column; background: #0F1014; position: relative">
        <div style="height: 36px; flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 0 12px; border-bottom: 1px solid #23252B">
          <div role="tablist" aria-label="Result tabs" style="display: flex; gap: 2px">
            <button type="button" role="tab" aria-selected="true" style="height: 24px; padding: 0 10px; border: 0; border-radius: 6px; background: #262830; font-size: 13px; font-weight: 500; cursor: pointer">SELECT users</button>
          </div>
          <span class="mono" style="color: #A3A6B0; font-size: 13px">500+ rows · 38 ms</span>
          <div style="flex: 1"></div>
          <button type="button" class="ibtn" aria-label="Copy selected cells">
            <svg aria-hidden="true" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="5" y="5" width="8.5" height="8.5" rx="1.5"></rect><path d="M11 5V3.5A1.5 1.5 0 0 0 9.5 2h-6A1.5 1.5 0 0 0 2 3.5v6A1.5 1.5 0 0 0 3.5 11H5"></path></svg>
          </button>
          <button type="button" class="btn btn-ghost" style="height: 26px; padding: 0 8px; font-size: 13px">
            <svg aria-hidden="true" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.5v8M4.5 7L8 10.5 11.5 7M3 13.5h10"></path></svg>
            Export
          </button>
        </div>

        <div role="grid" aria-label="SELECT users results" class="mono" style="flex: 1; min-height: 0; overflow: hidden; font-size: 13px">
          <div role="row" style="display: grid; grid-template-columns: {{gridCols}}; height: 32px; background: #15161B; border-bottom: 1px solid #23252B">
            <sc-for list="{{columns}}" as="col" hint-placeholder-count="7">
              <div role="columnheader" style="display: flex; align-items: center; gap: 6px; padding: 0 10px; border-right: 1px solid #23252B; min-width: 0; overflow: hidden">
                <span class="cs" style="font-weight: 600; font-size: 13px">{{col.name}}</span>
                <span style="font-size: 12px; color: #8A8E99">{{col.type}}</span>
                <span style="flex: 1"></span>
                <span style="{{col.sortStyle}}">{{col.sort}}</span>
              </div>
            </sc-for>
          </div>
          <sc-for list="{{rows}}" as="r" hint-placeholder-count="11">
            <div role="row" style="{{r.style}}">
              <sc-for list="{{r.cells}}" as="cell" hint-placeholder-count="7">
                <div role="gridcell" style="{{cell.style}}">{{cell.v}}</div>
              </sc-for>
            </div>
          </sc-for>
        </div>

        <!-- 일부만 받은 결과의 정렬 경고: column header의 정렬 icon에 hover하면 -->
        <div role="tooltip" class="cs" style="position: absolute; left: 700px; top: 72px; width: 260px; padding: 8px 10px; background: #262830; border: 1px solid #33363E; border-radius: 7px; box-shadow: 0 12px 32px rgba(0,0,0,0.5); font-size: 13px; line-height: 1.5">
          Sorted only the 500 rows received. To sort all rows, run again with <code class="code kw">ORDER BY</code>.
        </div>
      </section>

      <!-- Status bar: 에디터 정보만 -->
      <footer style="height: 24px; flex-shrink: 0; display: flex; align-items: center; justify-content: flex-end; gap: 14px; padding: 0 12px; border-top: 1px solid #23252B; background: #0F1014; color: #A3A6B0; font-size: 12px">
        <span>Ln 5, Col 26</span>
        <span>UTF-8</span>
        <span>LF</span>
      </footer>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#7C9CFF","options":["#7C9CFF","#5FC9B8","#C9A0FF"]},"connColor":{"editor":"color","default":"#3FB68B","options":["#3FB68B","#E8B04B","#EF6461","#A98BFF"]},"$preview":{"width":1512,"height":982}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#7C9CFF';
    const connColor = this.props.connColor ?? '#3FB68B';

    const connections = [
      { name: 'local', sub: '127.0.0.1:54318/chilla_test', color: connColor },
      { name: 'staging', sub: 'localhost:25432/app', color: '#E8B04B', tunnel: true },
      { name: 'prod', sub: 'db.example.com:5432/app', color: '#EF6461', readonly: true }
    ].map((c) => ({
      ...c,
      tunnel: !!c.tunnel,
      readonly: !!c.readonly,
      editLabel: 'Edit connection ' + c.name,
      dotStyle: 'background: ' + c.color
    }));

    const fileRow = (depth, active) =>
      'display: flex; align-items: center; gap: 6px; width: 100%; height: 26px; padding: 0 8px 0 ' + (8 + depth * 16) + 'px; border: 0; border-radius: 6px; cursor: pointer; text-align: left; font-size: 13px; ' +
      (active ? 'background: rgba(124,156,255,0.14); color: #E8E9ED' : 'background: transparent; color: #E8E9ED');
    const files = [
      { name: 'queries', folder: true, chevron: 'M4 6l4 4 4-4', depth: 0 },
      { name: 'first.sql', file: true, depth: 1, active: true },
      { name: 'users_by_day.sql', file: true, depth: 1, dirty: true },
      { name: 'cleanup.sql', file: true, depth: 1 },
      { name: 'reports', folder: true, chevron: 'M6 4l4 4-4 4', depth: 0 },
      { name: 'scratch.sql', file: true, depth: 0 }
    ].map((f) => ({ ...f, folder: !!f.folder, file: !!f.file, dirty: !!f.dirty, rowStyle: fileRow(f.depth, f.active) }));

    const tabs = [
      { title: 'first.sql', color: connColor, selected: true },
      { title: 'users_by_day.sql', color: connColor, dirty: true },
      { title: 'cleanup.sql', color: '#E8B04B', tx: true, txTime: '3:12' }
    ].map((t) => ({
      ...t,
      selected: t.selected ? 'true' : 'false',
      tx: !!t.tx,
      dirty: !!t.dirty,
      closable: !t.dirty,
      closeLabel: 'Close ' + t.title,
      wrapStyle: 'display: flex; align-items: center; gap: 4px; height: 31px; padding: 0 8px 0 12px; border-radius: 8px 8px 0 0; ' +
        (t.selected ? 'background: #15161B; color: #E8E9ED; border: 1px solid #23252B; border-bottom-color: #15161B; margin-bottom: -1px' : 'background: transparent; color: #A3A6B0; border: 1px solid transparent'),
      dotStyle: 'background: ' + t.color
    }));

    const C = {
      kw: 'color: #C792EA', fn: 'color: #82C8E5', str: 'color: #A8D49B', num: 'color: #F0B47D',
      com: 'color: #8A8E99; font-style: italic', op: 'color: #A3A6B0', id: 'color: #E8E9ED', ty: 'color: #FFCB6B'
    };
    const k = (t) => ({ t, s: C.kw });
    const i = (t) => ({ t, s: C.id });
    const o = (t) => ({ t, s: C.op });
    const src = [
      [{ t: '-- 최근 7일 가입자. 탈퇴한 사람도 포함', s: C.com }],
      [k('SELECT'), i(' u.id, u.email, u.display_name,')],
      [i('       u.created_at, u.profile, u.deleted_at')],
      [k('FROM'), i(' users u')],
      [k('WHERE'), i(' u.created_at '), o('>'), i(' '), { t: 'now', s: C.fn }, o('()'), i(' '), o('-'), i(' '), k('interval'), i(' '), { t: "'7 days'", s: C.str }],
      [k('ORDER BY'), i(' u.created_at '), k('DESC'), o(';')],
      [],
      [{ t: '-- 일별 집계', s: C.com }],
      [k('SELECT'), i(' '), { t: 'date_trunc', s: C.fn }, o('('), { t: "'day'", s: C.str }, i(', created_at)'), o('::'), { t: 'date', s: C.ty }, i(' '), k('AS'), i(' day,')],
      [i('       '), { t: 'count', s: C.fn }, o('(*)'), i(' '), k('FILTER'), i(' ('), k('WHERE'), i(' profile '), o('->>'), i(' '), { t: "'plan'", s: C.str }, i(' '), o('='), i(' '), { t: "'pro'", s: C.str }, i(') '), k('AS'), i(' pro')],
      [k('FROM'), i(' users')],
      [k('GROUP BY'), i(' '), { t: '1', s: C.num }, o(';')],
      [],
      []
    ];
    const lines = src.map((toks, idx) => {
      const n = idx + 1;
      const cur = n >= 2 && n <= 6;
      return {
        toks,
        gutter: n,
        cursor: n === 5,
        lineStyle: 'height: 24px; white-space: pre; padding-left: 12px; ' +
          (cur ? 'background: rgba(124,156,255,0.07); box-shadow: inset 2px 0 0 ' + accent : '')
      };
    });

    const gridCols = '52px 92px 250px 150px 236px minmax(0, 1fr) 132px';
    const columns = [
      { name: '', type: '', sort: '' },
      { name: 'id', type: 'int8', sort: '' },
      { name: 'email', type: 'text', sort: '' },
      { name: 'display_name', type: 'text', sort: '' },
      { name: 'created_at', type: 'timestamptz', sort: '↓', partial: true },
      { name: 'profile', type: 'jsonb', sort: '' },
      { name: 'deleted_at', type: 'timestamptz', sort: '' }
    ].map((c) => ({
      ...c,
      sortStyle: c.partial ? 'color: #E8E9ED; font-size: 13px; border-bottom: 1px dotted #A3A6B0; cursor: help' : 'display: none'
    }));

    const data = [
      ['10482', 'haneul.kim@example.com', '김하늘', '2026-11-18 09:41:07.215+09', '{"plan": "pro", "tags": ["beta"]}', null],
      ['10481', 'jun.lee@example.com', '이준', '2026-11-18 08:02:55.904+09', '{"plan": "free"}', null],
      ['10480', 'sora@example.com', '', '2026-11-17 23:15:40.118+09', '{"plan": "pro", "seats": 5, "billing": {…}}', null],
      ['10479', 'minji.park@example.com', '박민지', '2026-11-17 19:48:21.660+09', '{"plan": "team", "tags": []}', null],
      ['10478', 'dev+test@example.com', 'test', '2026-11-17 14:30:02.001+09', '{}', '2026-11-17 14:31:10+09'],
      ['10477', 'yuna.choi@example.com', '최유나', '2026-11-16 21:07:33.452+09', '{"plan": "free", "ref": "blog"}', null],
      ['10476', 'hyun@example.com', '정현', '2026-11-16 10:12:48.777+09', null, null],
      ['10475', 'seoyeon@example.com', '한서연', '2026-11-15 22:56:19.030+09', '{"plan": "pro"}', null],
      ['10474', 'ops@example.com', '운영팀', '2026-11-15 09:00:00.000+09', '{"plan": "team", "seats": 12}', null],
      ['10473', 'jiwoo.kang@example.com', '강지우', '2026-11-14 17:44:51.389+09', '{"plan": "free"}', null],
      ['10472', 'taeyang@example.com', '윤태양', '2026-11-14 08:20:06.512+09', '{"plan": "pro", "tags": ["vip"]}', null]
    ];
    const cellBase = 'display: flex; align-items: center; padding: 0 10px; border-right: 1px solid #1C1D23; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis';
    const rows = data.map((d, ri) => {
      const sel = ri === 2;
      const cells = [String(ri + 1)].concat(d).map((v, ci) => {
        let style = cellBase;
        let text = v;
        if (ci === 0) style += '; justify-content: flex-end; color: #8A8E99';
        else if (v === null) { text = 'NULL'; style += '; color: #8A8E99; font-style: italic'; }
        else if (v === '') { text = "''"; style += '; color: #8A8E99'; }
        else if (ci === 1) style += '; justify-content: flex-end; color: #F0B47D';
        else style += '; color: #E8E9ED';
        if (sel && ci === 2) style += '; box-shadow: inset 0 0 0 1.5px ' + accent + '; background: rgba(124,156,255,0.16)';
        return { v: text, style };
      });
      return {
        cells,
        style: 'display: grid; grid-template-columns: ' + gridCols + '; height: 26px; border-bottom: 1px solid #1C1D23; ' +
          (sel ? 'background: rgba(124,156,255,0.06)' : '')
      };
    });

    return { accent, connColor, connections, files, tabs, lines, columns, rows, gridCols };
  }
}
